<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f7faf8">
    <title>页面未找到 | Starki</title>
    <link rel="icon" id="siteIcon" href="/images/head.jpg">
    <link rel="stylesheet" id="siteStylesheet" href="/styles.css">
    <script>
        if (window.location.protocol === "file:") {
            document.getElementById("siteIcon").href = "./images/head.jpg";
            document.getElementById("siteStylesheet").href = "./styles.css";
        }
    </script>
</head>

<body>
    <main class="tool-shell">
        <section class="tool-hero" aria-labelledby="not-found-title">
            <p class="eyebrow">404</p>
            <h1 id="not-found-title">这里暂时没有页面</h1>
            <p>链接可能已经移动，回到主页就能继续浏览工具和小游戏。</p>
            <div class="page-actions">
                <a class="button" id="homeLink" href="/index.html">返回主页</a>
            </div>
        </section>
    </main>
    <script>
        if (window.location.protocol === "file:") {
            document.getElementById("homeLink").href = "./index.html";
        }
    </script>
</body>

</html>
