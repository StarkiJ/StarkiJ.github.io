<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="经典俄罗斯方块小游戏，支持键盘和手机手势操作。">
    <title>俄罗斯方块 | Starki</title>
    <link rel="canonical" href="https://starkij.github.io/games/tetris/index.html">
    <link rel="icon" href="../../images/head.jpg">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="site-header site-header--sticky">
        <div class="site-header-inner">
            <a class="brand" href="../../index.html" aria-label="Starki 主页">
                <img src="../../images/head.jpg" alt="Starki 的头像" width="42" height="42">
                <span>Starki</span>
            </a>
            <nav class="site-nav" aria-label="站点导航">
                <a href="../../index.html#about">关于</a>
                <a href="../../index.html#tools">工具</a>
                <a class="is-active" href="../../index.html#games" aria-current="location">游戏</a>
                <a href="../../notes/index.html">笔记</a>
                <a href="https://github.com/StarkiJ" target="_blank" rel="me noreferrer">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="tetris-shell">
        <a class="back-link" href="../../index.html#games">返回游戏</a>

        <section class="tetris-layout" aria-labelledby="game-title">
            <div class="board-stage" aria-label="俄罗斯方块棋盘">
                <canvas id="tetrisBoard" class="board-canvas" width="300" height="600"></canvas>
                <div class="gesture-guide" aria-label="手势操作说明">
                    <span>轻点旋转</span>
                    <span>左右滑动移动</span>
                    <span>下拖加速 · 快速下划直落</span>
                </div>
                <div class="board-message" id="boardMessage">
                    <strong>准备开局</strong>
                    <span>轻点棋盘开始，直接在棋盘上滑动操作。</span>
                </div>
            </div>

            <aside class="game-panel">
                <p class="eyebrow">Game</p>
                <h1 id="game-title">俄罗斯方块</h1>
                <p class="game-note">凑满一行就消除，速度会随着行数慢慢加快。</p>

                <div class="score-grid" aria-live="polite">
                    <div>
                        <span>分数</span>
                        <strong id="score">0</strong>
                    </div>
                    <div>
                        <span>最高分</span>
                        <strong id="bestScore">0</strong>
                    </div>
                    <div>
                        <span>等级</span>
                        <strong id="level">1</strong>
                    </div>
                    <div>
                        <span>消除行数</span>
                        <strong id="lines">0</strong>
                    </div>
                </div>

                <div class="next-panel">
                    <span>下一个</span>
                    <canvas id="nextPiece" width="120" height="120" aria-label="下一个方块"></canvas>
                </div>

                <div class="game-actions">
                    <button class="button" type="button" id="startButton">开始游戏</button>
                    <button class="button secondary" type="button" id="pauseButton" disabled>暂停</button>
                </div>

                <dl class="controls-list">
                    <div>
                        <dt>移动</dt>
                        <dd>左右滑动 / ← →</dd>
                    </div>
                    <div>
                        <dt>旋转</dt>
                        <dd>轻点棋盘 / ↑</dd>
                    </div>
                    <div>
                        <dt>加速</dt>
                        <dd>向下拖动 / ↓</dd>
                    </div>
                    <div>
                        <dt>直落</dt>
                        <dd>快速下划 / 空格</dd>
                    </div>
                </dl>
            </aside>
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>
