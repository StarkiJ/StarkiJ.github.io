<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="经典贪吃蛇小游戏，支持键盘、WASD 和手机手势操作。">
    <title>贪吃蛇 | Starki</title>
    <link rel="icon" href="../../images/head.jpg">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./snake.css">
</head>

<body>
    <header class="site-header site-header--sticky">
        <div class="site-header-inner">
            <a class="brand" href="../../index.html" aria-label="Starki 主页">
                <img src="../../images/head.jpg" alt="Starki 的头像" width="42" height="42">
                <span>Starki</span>
            </a>
            <nav class="site-nav" aria-label="站点导航">
                <a href="../../index.html#about">关于</a>
                <a href="../../index.html#tools">工具</a>
                <a class="is-active" href="../../index.html#games" aria-current="location">游戏</a>
                <a href="https://github.com/StarkiJ" target="_blank" rel="me noreferrer">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="snake-shell">
        <a class="back-link" href="../../index.html#games">返回游戏</a>

        <section class="snake-layout" aria-labelledby="game-title">
            <div class="board-stage" aria-label="贪吃蛇棋盘">
                <canvas id="snakeBoard" class="snake-canvas" width="588" height="588"></canvas>
                <div class="gesture-guide" aria-label="手势操作说明">
                    <span>滑动转向</span>
                    <span>连续滑动可快速转弯</span>
                    <span>轻点开始或继续</span>
                </div>
                <div class="board-message" id="boardMessage">
                    <strong>准备开局</strong>
                    <span>在棋盘上向任意方向滑动即可开始。</span>
                </div>
            </div>

            <aside class="game-panel">
                <p class="eyebrow">Game</p>
                <h1 id="game-title">贪吃蛇</h1>
                <p class="game-note">吃掉苹果拿分并提速，别撞墙，也别把自己绕进死胡同。</p>

                <div class="score-grid" aria-live="polite">
                    <div>
                        <span>分数</span>
                        <strong id="score">0</strong>
                    </div>
                    <div>
                        <span>最高分</span>
                        <strong id="bestScore">0</strong>
                    </div>
                    <div>
                        <span>长度</span>
                        <strong id="snakeLength">3</strong>
                    </div>
                    <div>
                        <span>速度</span>
                        <strong id="speedLevel">1</strong>
                    </div>
                </div>

                <div class="game-actions">
                    <button class="button" type="button" id="startButton">开始游戏</button>
                    <button class="button secondary" type="button" id="pauseButton" disabled>暂停</button>
                </div>

                <dl class="controls-list">
                    <div>
                        <dt>移动</dt>
                        <dd>滑动棋盘 / 方向键 / WASD</dd>
                    </div>
                    <div>
                        <dt>暂停</dt>
                        <dd>P 键</dd>
                    </div>
                    <div>
                        <dt>开局</dt>
                        <dd>轻点或滑动棋盘</dd>
                    </div>
                    <div>
                        <dt>手机</dt>
                        <dd>连续滑动可快速转弯</dd>
                    </div>
                </dl>
            </aside>
        </section>
    </main>

    <script src="./snake.js"></script>
</body>

</html>
